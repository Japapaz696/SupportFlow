name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validacao completa (format, lint, typecheck, build, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: supportflow
          POSTGRES_PASSWORD: supportflow
          POSTGRES_DB: supportflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow -d supportflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_VERSION: 20
      # Mesmos nomes de variavel do .env.example do projeto.
      DATABASE_URL: postgresql://supportflow:supportflow@localhost:5432/supportflow
      TEST_DATABASE_URL: postgresql://supportflow:supportflow@localhost:5432/supportflow_test
      POSTGRES_DB: supportflow
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow
      POSTGRES_PORT: 5432
      # Segredo descartavel, valido apenas para o runner do CI.
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 1h

    steps:
      - name: Fazer checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # O banco de testes precisa existir antes das migrations.
      # O POSTGRES_USER do container e superusuario, entao pode criar o banco.
      - name: Criar o banco de testes
        env:
          PGPASSWORD: supportflow
        run: |
          psql -h localhost -p 5432 -U supportflow -d postgres -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM pg_database WHERE datname='supportflow_test'" | grep -q 1 \
            || psql -h localhost -p 5432 -U supportflow -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE supportflow_test"

      # Migrations no banco de desenvolvimento (schema public).
      - name: Aplicar migrations no banco de desenvolvimento
        run: npm run db:migrate

      # Migrations no banco de testes. O env.ts so usa TEST_DATABASE_URL
      # quando VITEST=1, entao o DATABASE_URL precisa apontar para o banco
      # de testes durante a migration.
      - name: Aplicar migrations no banco de testes
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:migrate

      # Script de validacao ja existente no package.json da raiz:
      # format:check && lint && typecheck && build && test.
      # O typecheck/build compilam o pacote @supportflow/shared, exigido
      # pela suite de integracao.
      - name: Rodar a validacao completa
        run: npm run validate
